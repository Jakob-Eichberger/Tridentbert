[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f446xx_440035001550535556323420-if00
restart_method: command

#####################################################################
#   Extruder
#####################################################################

[printer]
kinematics: corexy
max_velocity: 200
max_accel: 2000
max_z_velocity: 15
max_z_accel: 45
square_corner_velocity: 6.0

[extruder]
step_pin: PE6
dir_pin: PA14                                                      # Add ! if moving opposite direction
enable_pin: !PE0
full_steps_per_rotation: 200                                       # Set to 200 for LDO 1.8° stepper motor, and set to 400 for OMC(StepperOnline) 0.9° stepper motor
rotation_distance: 22.23                                           # See calibrating rotation_distance on extruders doc
gear_ratio: 50:10                                                   # For Mini Afterburner
microsteps: 32
nozzle_diameter: 0.500
filament_diameter: 1.750

heater_pin: PB10                                                  
sensor_type: PT1000    

sensor_pin: PF4
min_temp: 0
max_temp: 500
min_extrude_temp: 170
max_extrude_only_distance: 150
max_extrude_cross_section: 3
pressure_advance: 0.025                                              # See tuning pressure advance doc
pressure_advance_smooth_time: 0.040
max_extrude_only_distance: 105

# MPC settings
control: mpc
cooling_fan: fan
filament_diameter: 1.75
filament_density: 1.20
filament_heat_capacity: 1.8 
heater_power: 64   # -> https://docs.kalico.gg/MPC.html?h=mpc#ptc-heater-power

[tmc2240 extruder]
uart_pin: PD3
interpolate: False
run_current: 0.6
stealthchop_threshold: 0       
rref: 12000

#####################################################################
#   Motors
#####################################################################

# Driver0
[stepper_x]
step_pin: PF13
dir_pin: PF12
enable_pin: !PF14
microsteps: 16
rotation_distance: 40
endstop_pin: PG6
position_endstop: 0
position_max: 200
homing_speed: 50

# Driver1
[stepper_y]
step_pin: PG0
dir_pin: PG1
enable_pin: !PF15
microsteps: 16
rotation_distance: 40
endstop_pin: PG9
position_endstop: 0
position_max: 200
homing_speed: 50

[tmc2240 stepper_x]
uart_pin: PC4
run_current: 0.800
stealthchop_threshold: 999999
rref: 12000

[tmc2240 stepper_y]
uart_pin: PD11
run_current: 0.800
stealthchop_threshold: 999999
rref: 12000

[stepper_z]
step_pin: PF11
dir_pin: PG3
enable_pin: !PG5
microsteps: 16
rotation_distance: 8
endstop_pin: PG10
position_endstop: 0.5
position_max: 200

[tmc2240 stepper_z]
uart_pin: PC6
run_current: 0.650
stealthchop_threshold: 999999
rref: 12000

#####################################################################
#   Fans
#####################################################################

[fan]
pin: PA8