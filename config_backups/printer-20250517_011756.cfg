[include mainsail.cfg]

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f446xx_440035001550535556323420-if00
restart_method: command

#####################################################################
#   Extruder
#####################################################################

[printer]
kinematics: corexy
max_velocity: 200
max_accel: 2000
max_z_velocity: 15
max_z_accel: 45
square_corner_velocity: 6.0

[extruder]
step_pin: PE6
dir_pin: PA14                                                      # Add ! if moving opposite direction
enable_pin: !PE0
full_steps_per_rotation: 200                                       # Set to 200 for LDO 1.8° stepper motor, and set to 400 for OMC(StepperOnline) 0.9° stepper motor
rotation_distance: 22.23                                           # See calibrating rotation_distance on extruders doc
gear_ratio: 50:10                                                   # For Mini Afterburner
microsteps: 32
nozzle_diameter: 0.500
filament_diameter: 1.750

heater_pin: PB10                                                  
sensor_type: PT1000    

sensor_pin: PF4
min_temp: 0
max_temp: 500
min_extrude_temp: 170
max_extrude_only_distance: 150
max_extrude_cross_section: 3
pressure_advance: 0.025                                              # See tuning pressure advance doc
pressure_advance_smooth_time: 0.040
max_extrude_only_distance: 105

# MPC settings
#control: mpc
cooling_fan: fan
filament_diameter: 1.75
filament_density: 1.20
filament_heat_capacity: 1.8 
heater_power: 64   # -> https://docs.kalico.gg/MPC.html?h=mpc#ptc-heater-power

[tmc2240 extruder]
uart_pin: PD3
interpolate: False
run_current: 0.6
stealthchop_threshold: 0       
rref: 12000

#####################################################################
#   Motors
#####################################################################

# Driver3
[stepper_x1]
enable_pin: !PA0
step_pin: PG4
dir_pin: !PC1
microsteps: 16
rotation_distance: 40

[tmc2240 stepper_x1]
cs_pin: PC7
spi_bus: spi1
rref: 12000
run_current: 0.800
stealthchop_threshold: 999999


# Driver4
[stepper_x]
enable_pin: !PG2
step_pin: PF9
dir_pin: !PF10
microsteps: 16
rotation_distance: 40

endstop_pin: tmc2240_stepper_x:virtual_endstop
position_endstop: 300
position_max: 300
homing_speed: 80
homing_retract_dist: 60
min_home_dist: 40
homing_positive_dir: true
use_sensorless_homing: true

[tmc2240 stepper_x]
cs_pin: PF2
spi_bus: spi1
rref: 12000
stealthchop_threshold: 999999
run_current: 0.800

home_current: 0.5
diag0_pin: ^!PG12
driver_SGT: 2

# Driver5
[stepper_y1]
enable_pin: !PF1
step_pin: PC13
dir_pin: !PF0
microsteps: 16
rotation_distance: 40

[tmc2240 stepper_y1]
cs_pin: PE4
spi_bus: spi1
rref: 12000
stealthchop_threshold: 999999
run_current: 0.800


# Driver6
[stepper_y] 
enable_pin: !PD4
step_pin: PE2
dir_pin: !PE3
microsteps: 16
rotation_distance: 40
endstop_pin: tmc2240_stepper_y:virtual_endstop
position_endstop: 270
position_max: 270
homing_speed: 80
homing_retract_dist: 60
min_home_dist: 40
homing_positive_dir: true
use_sensorless_homing: true

[tmc2240 stepper_y]
cs_pin: PE1
spi_bus: spi1
rref: 12000
stealthchop_threshold: 999999
run_current: 0.800

home_current: 0.5
diag0_pin: ^!PG14
driver_SGT: 1

# Driver0
[stepper_z]
enable_pin: !PF14
step_pin: PF13
dir_pin: !PF12
microsteps: 16
rotation_distance: 8
endstop_pin: PG10
position_endstop: 00
position_max: 250

[tmc2240 stepper_z]
cs_pin: PC4
spi_bus: spi1
rref: 12000
stealthchop_threshold: 999999
run_current: 0.800

# Driver1
[stepper_z1]
enable_pin: !PF15
step_pin: PG0
dir_pin: !PG1
microsteps: 16
rotation_distance: 8
endstop_pin: PG10

[tmc2240 stepper_z1]
cs_pin: PD11
spi_bus: spi1
rref: 12000
stealthchop_threshold: 999999
run_current: 0.800

# Driver2
[stepper_z2]
enable_pin: !PG5
step_pin: PF11
dir_pin: !PG3
microsteps: 16
rotation_distance: 8

[tmc2240 stepper_z2]
cs_pin: PC6
spi_bus: spi1
rref: 12000
stealthchop_threshold: 999999
run_current: 0.800

#####################################################################
#   Bed Mesh + Probe
#####################################################################

[beacon]
serial: /dev/serial/by-id/usb-Beacon_Beacon_RevH_7A4B73935154354D38202020FF0A1731-if00
is_non_critical: True
home_method: contact
home_method_when_homed: contact
home_autocalibrate: unhomed
x_offset: 20 # update with offset from nozzle on your machine
y_offset: 0 # update with offset from nozzle on your machine
mesh_main_direction: x
mesh_runs: 2
speed: 100
lift_speed: 250
home_xy_position: 150,150
home_xy_move_speed: 300
home_z_hop_speed: 50

[resonance_tester]
accel_chip: beacon
probe_points: 150, 150, 20

[bed_mesh]
speed: 250
horizontal_move_z: 15
mesh_min: 35, 35
mesh_max: 250, 250
probe_count: 5, 5
mesh_pps: 3, 3 #specifies how many points to interpolate for each segment along the X and Y axes
algorithm: lagrange


[z_tilt]
##  Use Z_TILT_ADJUST to level the bed .
##  z_positions: Location of toolhead

z_positions:
   -50, 18
   150, 348
   350, 18
points:
   30, 5
   150, 245
   270, 5


#####################################################################
#   Fans
#####################################################################

[fan]
pin: PA8

